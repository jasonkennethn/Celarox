services:
  - type: web
    name: celarox-enterprise-backend
    env: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn celarox_core.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "celarox.onrender.com,celarox.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://celarox.com,https://celarox.onrender.com,http://localhost:8081,http://localhost:3000,http://localhost:19006"
